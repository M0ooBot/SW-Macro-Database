name: Verification report
description: You ran an entry, a C# recipe or a script against a real SolidWorks. Report what happened, so its status can be updated.
title: "Verification: "
labels: ["verification"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when an entry, its C# recipe or a prebuilt script was run against a real SolidWorks and you saw
        the result, whether it worked or not. Failures are as useful as successes. Only what was actually run counts.
        The owner turns this into an evidence record (evidence/<id>.json), so the fields below are its fields.
        This repository is public: leave out paths, user names and the names of your own files.
  - type: input
    id: subject
    attributes:
      label: Entry or script
      description: The entry id (e.g. files-03-upgrade-file-version) or the script id (e.g. upgrade-file-version).
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: What code ran
      options:
        - The entry's C# recipe, or the script (C#)
        - Python (pywin32)
        - VBA
        - VBScript
        - Other code shown in the entry
    validations:
      required: true
  - type: input
    id: sw_revision
    attributes:
      label: SolidWorks revision
      description: What ISldWorks.RevisionNumber returned, e.g. "34.1.1"; if you do not have it, the version with its service pack, e.g. "SolidWorks 2026 SP1.1".
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date of the run
      description: YYYY-MM-DD
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: How it was run
      options:
        - SW-Agent (a script, a snippet or its smoke run)
        - My own program or macro
        - A probe written to test this one call
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      description: The record's result and scope.
      options:
        - It all worked as the entry/script says (pass, full)
        - Part of it worked, and I say which part below (pass, partial)
        - It did not work (fail)
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What was run
      description: The script and its parameters, or the code, and on what kind of files.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What was observed
      description: Counts, return values, error numbers, what the model looked like afterwards. "It worked" is not enough. No paths, user names or file names.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Tool output (optional)
      description: The log or the tool result, if you are happy to share it.
      render: text
