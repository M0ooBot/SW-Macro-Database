name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The job name is a required status check on main; do not rename it.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags too, so validate writes the release notes against the last
          # release (the format-change path), as the release workflow will.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
